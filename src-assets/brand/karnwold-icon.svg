<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Karnwold">
  <title>Karnwold icon</title>
  <!-- Official Karnwold app/brand mark: a crenellated bronze keep crowned by a
       glowing ember, on the dark-walnut brand tile. Master vector asset. -->
  <defs>
    <linearGradient id="kwKeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c987"/>
      <stop offset="1" stop-color="#c8842f"/>
    </linearGradient>
    <radialGradient id="kwEmberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#f4a93c"/>
      <stop offset="1" stop-color="#f4a93c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#1d1711"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#6b4a26" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- ember glow -->
  <circle cx="32" cy="17" r="9" fill="url(#kwEmberGlow)"/>

  <!-- crenellated keep silhouette -->
  <path fill="url(#kwKeep)" d="M14 28 h6 v-5 h5 v5 h5 v-5 h5 v5 h5 v-5 h5 v5 h5 v20 a3 3 0 0 1 -3 3 H17 a3 3 0 0 1 -3 -3 Z"/>

  <!-- gate -->
  <path d="M28 51 v-9 a4 4 0 0 1 8 0 v9 Z" fill="#1d1711"/>

  <!-- ember core -->
  <circle cx="32" cy="17" r="3.2" fill="#ffce6b"/>
</svg>
