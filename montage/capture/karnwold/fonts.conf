<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="relative">fonts/cache</cachedir>
  <alias binding="strong"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>sans</family><prefer><family>Roboto</family></prefer></alias>
</fontconfig>
